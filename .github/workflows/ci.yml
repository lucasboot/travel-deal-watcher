name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest
      - name: Validate example configuration
        run: travel-deal-watcher --config config.yaml validate-config
